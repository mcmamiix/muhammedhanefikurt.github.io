<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Google 1998</title>
  <!-- CSS dosyalarını doğru şekilde bağlama -->
  <link rel="stylesheet" href="google1998.css">
</head>
<body>
  <div class="container">
    <!-- Google logosu -->
    <img src="https://www.google.com/logos/1998/googlebeta.jpg" alt="Google Logo" class="logo">

    <!-- Arama kutusu ve butonlar -->
    <form action="https://www.google.com/search" method="get">
      <input type="text" name="q" class="search-box" placeholder="Google'da ara...">
      <br><br>
      <input type="submit" value="Google Search" class="btn">
      <input type="submit" value="I'm Feeling Lucky" name="btnI" class="btn">
    </form>

    <!-- Alt linkler -->
    <div class="links">
      <a href="https://www.google.com/advanced_search">Advanced Search</a> |
      <a href="https://www.google.com/help">Help</a> |
      <a href="https://www.google.com/about">About Google</a>
    </div>

    <!-- Yeni alt metinler -->
    <footer class="footer">
      <p>© 1998 Google Inc.</p>
      <p>Google, Larry Page ve Sergey Brin tarafından Stanford Üniversitesi'nde geliştirilmiştir.</p>
      <p>Bu sayfa, Google'ın ilk sürümünü yeniden tasarlamak için hazırlanmıştır.</p>
    </footer>
  </div>
</body>
</html>
