<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="stylesheet" ="href="google1998.css">
  <meta charset="UTF-8">
  <title>Google 1998</title>
</head>
<body>
  <!-- Sayfanın ortalanması için basit bir tablo yapısı -->
  <table align="center" width="90%">
    <tr>
      <td align="center">
        <!-- Google logosu -->
        <img src="https://www.google.com/logos/1998/googlebeta.jpg" alt="Google Logo">
      </td>
    </tr>
    <tr>
      <td align="center">
        <!-- Arama kutusu -->
        <form>
          <input type="text" name="q" size="40"><br><br>
          <!-- Arama butonları -->
          <input type="submit" value="Google Search">
          <input type="submit" value="I'm Feeling Lucky">
        </form>
      </td>
    </tr>
    <tr>
      <td align="center">
        <!-- Alt linkler -->
        <p>
          <a href="https://www.google.com/advanced_search">Advanced Search</a> |
          <a href="https://www.google.com/help">Help</a> |
          <a href="https://www.google.com/about">About Google</a>
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
